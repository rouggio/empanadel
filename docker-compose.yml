services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empanadel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/empanadel
      JWT_SECRET: dev-secret-change-me-32chars!!
      CLUB_TIMEZONE: Europe/Rome
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:

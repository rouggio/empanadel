<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empanadel — Tennis & Padel Booking</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">
    <div x-data="app()" x-init="init()" class="flex min-h-screen flex-col">
      <header class="sticky top-0 z-30 border-b bg-white/80 backdrop-blur">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
          <a href="#" class="text-lg font-bold tracking-tight" x-text="t('app.name')">Empanadel</a>
          <nav class="hidden gap-6 text-sm md:flex">
            <a href="#courts" class="hover:text-black" x-text="t('nav.courts')"></a>
            <a href="#me" x-show="user" class="hover:text-black" x-text="t('nav.myBookings')"></a>
            <a href="#profile" x-show="user" class="hover:text-black" x-text="t('nav.profile')"></a>
            <a href="#admin" class="hover:text-black" x-show="user?.role==='admin'" x-text="t('nav.admin')"></a>
          </nav>
          <div class="flex items-center gap-2">
            <template x-if="!user">
              <div class="flex items-center gap-2 relative">
                <label class="hidden text-xs text-zinc-500 md:block" x-text="t('lang.label')"></label>
                <button @click="headerLangOpen=!headerLangOpen" class="flex items-center gap-2 rounded-full border bg-white px-2 py-1 text-xs">
                  <img :src="flagUrl(lang)" class="h-3 w-4 object-cover rounded-sm" :alt="lang" />
                  <span x-text="t('lang.'+lang)"></span>
                </button>
                <div x-show="headerLangOpen" @click.outside="headerLangOpen=false" class="absolute right-0 top-8 mt-1 w-44 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
                  <template x-for="l in ['it','en','fr','de','es']" :key="l">
                    <button @click="setLang(l); headerLangOpen=false" class="flex w-full items-center gap-2 px-3 py-2 text-xs hover:bg-zinc-50 text-left">
                      <img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" />
                      <span x-text="t('lang.'+l)"></span>
                    </button>
                  </template>
                </div>
              </div>
            </template>
            <span x-show="user" class="hidden text-sm text-zinc-600 md:inline" x-text="user?.username"></span>
            <button x-show="!user" @click="view='login'" class="rounded-full bg-black px-4 py-2 text-sm font-medium text-white" x-text="t('nav.login')"></button>
            <button x-show="user" @click="logout()" class="rounded-full border px-4 py-2 text-sm" x-text="t('nav.logout')"></button>
          </div>
        </div>
      </header>

      <nav class="fixed inset-x-0 bottom-0 z-30 flex border-t bg-white px-2 py-2 md:hidden">
        <a href="#courts" class="flex flex-1 flex-col items-center text-xs" x-text="t('nav.courts')"></a>
        <a href="#me" class="flex flex-1 flex-col items-center text-xs" x-text="t('nav.myBookings')"></a>
        <a href="#profile" x-show="user" class="flex flex-1 flex-col items-center text-xs" x-text="t('nav.profile')"></a>
        <a href="#admin" x-show="user?.role==='admin'" class="flex flex-1 flex-col items-center text-xs" x-text="t('nav.admin')"></a>
      </nav>

      <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 pb-20 md:pb-6">
        <section x-show="view==='home'" class="space-y-6">
          <div class="rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 p-8 text-white">
            <h1 class="text-3xl font-bold md:text-4xl" x-text="t('hero.title')"></h1>
            <p class="mt-2 max-w-xl text-white/90" x-text="t('hero.subtitle')"></p>
            <a href="#courts" @click.prevent="view='courts'; loadCourts()" class="mt-4 inline-block rounded-full bg-white px-6 py-2 text-sm font-semibold text-emerald-700" x-text="t('hero.cta')"></a>
          </div>
          <div class="grid gap-4 md:grid-cols-3">
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('card.tennis')"></div><div class="text-sm text-zinc-600" x-text="t('card.tennis.desc')"></div></div>
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('card.padel')"></div><div class="text-sm text-zinc-600" x-text="t('card.padel.desc')"></div></div>
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('card.lessons')"></div><div class="text-sm text-zinc-600" x-text="t('card.lessons.desc')"></div></div>
          </div>
          <div x-show="pendingIntent" class="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm">
            <span x-text="t('hold.expiresIn') + ':'"></span> <span class="font-mono font-bold" x-text="`${pendingIntent?.courtLabel} · ${pendingIntent?.date} ${pendingIntent?.startTime}`"></span> — <span x-text="t('hold.confirm')"></span>
            <button @click="view='register'" class="ml-2 rounded-full bg-amber-500 px-3 py-1 text-xs text-white">Register to confirm</button>
          </div>
        </section>

        <section x-show="view==='courts'" class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-xl font-bold" x-text="t('courts.title')"></h2>
            <div class="flex gap-2">
              <select x-model="filterType" class="rounded-lg border px-3 py-2 text-sm">
                <option value="" x-text="t('filter.all')"></option><option value="tennis">Tennis</option><option value="padel">Padel</option>
              </select>
              <input type="date" x-model="selectedDate" class="rounded-lg border px-3 py-2 text-sm" />
              <button @click="loadAvailability()" class="rounded-lg bg-black px-4 py-2 text-sm text-white" x-text="t('btn.refresh')"></button>
            </div>
          </div>
          <div x-show="user?.role==='admin' && timetableAdminSelected" class="rounded-xl border p-4 flex flex-wrap items-center justify-between gap-2" :class="timetableAdminSelected?.status==='pending_approval' ? 'border-amber-300 bg-amber-50' : 'border-red-300 bg-red-50'">
            <div class="text-sm">
              <div class="font-semibold" x-text="`${timetableAdminSelected?.status==='pending_approval' ? 'Pending' : 'Booked'}: ${timetableAdminSelected?.courtId ? (courts.find(c=>c.id===timetableAdminSelected.courtId)?.number ? 'Court ' + courts.find(c=>c.id===timetableAdminSelected.courtId).number : timetableAdminSelected.courtId.slice(0,8)) : ''} · ${timetableAdminSelected?.date} ${timetableAdminSelected?.startTime}`"></div>
              <div class="text-xs text-zinc-600" x-text="t('status.'+timetableAdminSelected?.status)"></div>
            </div>
            <div class="flex gap-2">
              <button x-show="timetableAdminSelected?.status==='pending_approval'" @click="timetableApprove()" class="rounded-full bg-emerald-600 px-4 py-2 text-xs font-medium text-white">Approve</button>
              <button @click="timetableReject()" class="rounded-full border bg-white px-4 py-2 text-xs">Reject</button>
              <button @click="timetableAdminSelected=null" class="rounded-full border bg-white px-3 py-2 text-xs">×</button>
            </div>
          </div>
          <div class="grid gap-3 md:grid-cols-2">
            <template x-for="court in filteredCourts()" :key="court.id">
              <div class="rounded-xl border bg-white p-4">
                <div class="flex items-center justify-between">
                  <div><div class="font-semibold" x-text="`Court ${court.number} · ${court.type}`"></div><div class="text-xs text-zinc-500" x-text="court.name || court.surface || ''"></div></div>
                  <span class="rounded-full px-2 py-1 text-xs" :class="court.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-zinc-100'"> <span x-text="court.is_active ? t('court.active') : t('court.inactive')"></span></span>
                </div>
                <div class="mt-3 grid grid-cols-4 gap-2">
                  <template x-for="slot in availability[court.id] || []" :key="slot.start">
                    <button
                      @click="selectSlot(court, slot)"
                      :disabled="slot.status!=='available' && !(user?.role==='admin' && (slot.status==='pending_approval' || slot.status==='booked'))"
                      class="rounded-lg border px-2 py-2 text-xs font-medium"
                      :class="slot.status==='available' ? 'bg-emerald-50 hover:bg-emerald-100 border-emerald-200' : slot.status==='booked' ? 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100' : slot.status==='pending_approval' ? 'bg-amber-100 text-amber-700 border-amber-300 hover:bg-amber-200' : 'bg-zinc-100 text-zinc-400'"
                      x-text="`${slot.start} ${slot.status==='available' ? '✓' : t('status.'+slot.status)}`"
                    ></button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>

        <section x-show="view==='confirm'" class="mx-auto max-w-md space-y-4 rounded-xl border bg-white p-6">
          <h2 class="text-lg font-bold">Confirm booking</h2>
          <div class="rounded-lg bg-zinc-50 p-4 border text-sm">
            <div class="font-semibold" x-text="pendingIntent?.courtLabel"></div>
            <div x-text="`${pendingIntent?.date} · ${pendingIntent?.startTime}`"></div>
            <div class="text-xs text-zinc-500" x-text="pendingIntent?.courtType ? (pendingIntent.courtType === 'padel' ? 'Padel' : 'Tennis') : ''"></div>
          </div>
          <div class="space-y-1">
            <label class="text-sm font-medium">Notes for admin (optional)</label>
            <textarea x-model="confirmNotes" rows="3" maxlength="1000" placeholder="Any notes for the admin..." class="w-full rounded-lg border px-3 py-2 text-sm"></textarea>
            <div class="text-xs text-zinc-400 text-right" x-text="`${confirmNotes.length}/1000`"></div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1">
              <label class="text-sm font-medium">Rent racquets</label>
              <select x-model.number="confirmRent" class="w-full rounded-lg border px-3 py-2 text-sm">
                <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
              </select>
              <div class="text-xs text-zinc-500">0–4</div>
            </div>
            <div class="space-y-1">
              <label class="text-sm font-medium">Players</label>
              <div class="flex gap-4 pt-2">
                <label class="flex items-center gap-2 text-sm"><input type="radio" value="single" x-model="confirmPlayers" /> Single (2)</label>
                <label class="flex items-center gap-2 text-sm"><input type="radio" value="double" x-model="confirmPlayers" /> Double (4)</label>
              </div>
            </div>
          </div>
          <div class="flex gap-2">
            <button @click="cancelConfirm()" class="flex-1 rounded-lg border py-2 text-sm">Cancel</button>
            <button @click="confirmBooking()" class="flex-1 rounded-lg bg-emerald-600 py-2 text-sm font-medium text-white" x-text="user ? 'Confirm booking' : 'Continue to register'"></button>
          </div>
        </section>

        <section x-show="view==='login'" class="mx-auto max-w-md space-y-4 rounded-xl border bg-white p-6">
          <h2 class="text-lg font-bold" x-text="t('auth.login')"></h2>
          <input x-model="authForm.username" :placeholder="t('auth.usernameOrEmail')" class="w-full rounded-lg border px-3 py-2" />
          <input x-model="authForm.password" type="password" :placeholder="t('auth.password')" class="w-full rounded-lg border px-3 py-2" />
          <button @click="login()" class="w-full rounded-lg bg-black py-2 text-white" x-text="t('auth.login')"></button>
          <button @click="view='register'" class="w-full text-sm text-zinc-600" x-text="t('auth.needAccount')"></button>
          <p x-show="authError" class="text-sm text-red-600" x-text="authError"></p>
        </section>

        <section x-show="view==='register'" class="mx-auto max-w-md space-y-4 rounded-xl border bg-white p-6">
          <h2 class="text-lg font-bold" x-text="t('auth.registerTitle')"></h2>
          <div x-show="pendingIntent" class="rounded-lg bg-amber-50 p-3 text-xs border border-amber-200">
            <div class="font-medium" x-text="pendingIntent?.courtLabel"></div>
            <div x-text="`${pendingIntent?.date} · ${pendingIntent?.startTime}`"></div>
            <div class="text-zinc-500" x-text="t('hold.confirm')"></div>
          </div>
          <input x-model="regForm.username" :placeholder="t('auth.username')" class="w-full rounded-lg border px-3 py-2" />
          <input x-model="regForm.email" :placeholder="t('auth.email')" class="w-full rounded-lg border px-3 py-2" />
          <input x-model="regForm.first_name" :placeholder="t('auth.firstName')" class="w-full rounded-lg border px-3 py-2" />
          <input x-model="regForm.last_name" :placeholder="t('auth.lastName')" class="w-full rounded-lg border px-3 py-2" />
          <input x-model="regForm.password" type="password" :placeholder="t('auth.passwordHint')" class="w-full rounded-lg border px-3 py-2" />
          <div class="flex items-center gap-2 relative">
            <button @click="registerLangOpen=!registerLangOpen" class="flex items-center gap-2 rounded-lg border bg-white px-3 py-2 text-xs">
              <img :src="flagUrl(lang)" class="h-3 w-4 object-cover rounded-sm" :alt="lang" />
              <span x-text="t('lang.'+lang)"></span>
            </button>
            <div x-show="registerLangOpen" @click.outside="registerLangOpen=false" class="absolute left-0 top-10 mt-1 w-44 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
              <template x-for="l in ['it','en','fr','de','es']" :key="l">
                <button @click="lang=l; setLang(l); registerLangOpen=false" class="flex w-full items-center gap-2 px-3 py-2 text-xs hover:bg-zinc-50 text-left">
                  <img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" />
                  <span x-text="t('lang.'+l)"></span>
                </button>
              </template>
            </div>
          </div>
          <button @click="register()" class="w-full rounded-lg bg-emerald-600 py-2 text-white" x-text="t('auth.confirm')"></button>
          <button @click="view='login'" class="w-full text-sm text-zinc-600" x-text="t('auth.haveAccount')"></button>
          <p x-show="authError" class="text-sm text-red-600" x-text="authError"></p>
        </section>

        <section x-show="view==='me'" class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold" x-text="t('myBookings.title')"></h2>
            <button @click="loadBookings()" class="rounded-lg border px-3 py-1 text-xs" x-text="t('btn.refresh')"></button>
          </div>
          <div class="flex gap-2">
            <button @click="bookingsTab='upcoming'; loadBookings()" class="rounded-full px-3 py-1 text-xs" :class="bookingsTab==='upcoming' ? 'bg-black text-white' : 'border bg-white'" x-text="'Upcoming'"></button>
            <button @click="bookingsTab='past'" class="rounded-full px-3 py-1 text-xs" :class="bookingsTab==='past' ? 'bg-black text-white' : 'border bg-white'" x-text="'Past'"></button>
            <button @click="bookingsTab='all'" class="rounded-full px-3 py-1 text-xs" :class="bookingsTab==='all' ? 'bg-black text-white' : 'border bg-white'" x-text="t('filter.all')"></button>
          </div>
          <p x-show="bookingsLoading" class="text-sm text-zinc-500">Loading…</p>
          <p x-show="bookingsError" class="text-sm text-red-600" x-text="bookingsError"></p>
          <p x-show="!bookingsLoading && filteredBookings().length===0" class="rounded-xl border bg-white p-4 text-sm text-zinc-500 text-center" x-text="bookings.length===0 ? t('myBookings.hint') + ' — no bookings yet' : 'No bookings in this tab'"></p>
          <div class="space-y-3">
            <template x-for="b in filteredBookings()" :key="b.id">
              <div class="rounded-xl border bg-white p-4">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="font-semibold" x-text="courtLabel(b)"></div>
                    <div class="text-sm text-zinc-600" x-text="`${b.date} · ${b.startTime}–${b.endTime}`"></div>
                    <div class="text-xs text-zinc-500" x-text="`${b.players===4 ? 'Double' : 'Single'} · ${b.rentRacquets ? b.rentRacquets + ' racquet(s) rented' : 'No racquet rental'}`"></div>
                    <div x-show="b.notes" class="mt-1 text-xs italic text-zinc-600" x-text="`&quot;${b.notes}&quot;`"></div>
                    <div class="mt-1 text-xs text-zinc-400" x-text="b.id.slice(0,8)"></div>
                  </div>
                  <span class="rounded-full px-2 py-1 text-xs font-medium" :class="statusClass(b.status)" x-text="t('status.'+b.status)"></span>
                </div>
                <div class="mt-3 flex gap-2" x-show="editingBooking!==b.id && (b.status==='pending_approval' || b.status==='approved')">
                  <button @click="startEditBooking(b)" class="rounded-full border px-3 py-1 text-xs hover:bg-zinc-50">Edit</button>
                  <button @click="cancelBooking(b.id)" class="rounded-full border px-3 py-1 text-xs hover:bg-zinc-50">Cancel</button>
                </div>
                <div x-show="editingBooking===b.id" class="mt-3 space-y-2 rounded-lg border bg-zinc-50 p-3">
                  <textarea x-model="editNotes" rows="2" placeholder="Notes" class="w-full rounded border px-2 py-1 text-xs"></textarea>
                  <div class="grid grid-cols-2 gap-2">
                    <select x-model.number="editRent" class="rounded border px-2 py-1 text-xs">
                      <option value="0">0 racquets</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                    </select>
                    <div class="flex gap-2 text-xs">
                      <label class="flex items-center gap-1"><input type="radio" value="single" x-model="editPlayers" /> Single</label>
                      <label class="flex items-center gap-1"><input type="radio" value="double" x-model="editPlayers" /> Double</label>
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <button @click="saveEditBooking(b.id)" class="rounded bg-black px-3 py-1 text-xs text-white">Save</button>
                    <button @click="cancelEditBooking()" class="rounded border px-3 py-1 text-xs">Cancel</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>

        <section x-show="view==='profile'" class="mx-auto max-w-md space-y-4 rounded-xl border bg-white p-6" x-init="if(user) loadProfile()">
          <h2 class="text-xl font-bold" x-text="t('nav.profile')"></h2>
          <p x-show="profileLoading" class="text-sm text-zinc-500">Loading…</p>
          <p x-show="profileError" class="text-sm text-red-600" x-text="profileError"></p>
          <p x-show="profileSuccess" class="text-sm text-emerald-600" x-text="profileSuccess"></p>
          <div class="space-y-3">
            <input x-model="profileForm.username" placeholder="username" class="w-full rounded-lg border px-3 py-2 text-sm" />
            <input x-model="profileForm.email" placeholder="email" class="w-full rounded-lg border px-3 py-2 text-sm" />
            <div class="grid grid-cols-2 gap-2">
              <input x-model="profileForm.first_name" placeholder="first name" class="rounded-lg border px-3 py-2 text-sm" />
              <input x-model="profileForm.last_name" placeholder="last name" class="rounded-lg border px-3 py-2 text-sm" />
            </div>
            <input x-model="profileForm.mobile" placeholder="mobile" class="w-full rounded-lg border px-3 py-2 text-sm" />
            <select x-model="profileForm.gender" class="w-full rounded-lg border px-3 py-2 text-sm">
              <option value="">— gender —</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
              <option value="prefer_not_to_say">Prefer not to say</option>
            </select>
            <input x-model="profileForm.birthdate" type="date" class="w-full rounded-lg border px-3 py-2 text-sm" />
            <div class="relative">
              <button @click="profileLangOpen=!profileLangOpen" type="button" class="flex w-full items-center gap-2 rounded-lg border px-3 py-2 text-sm bg-white">
                <img :src="flagUrl(profileForm.preferred_language)" class="h-3 w-4 object-cover rounded-sm" :alt="profileForm.preferred_language" />
                <span x-text="t('lang.'+profileForm.preferred_language)"></span>
              </button>
              <div x-show="profileLangOpen" @click.outside="profileLangOpen=false" class="absolute left-0 mt-1 w-full rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
                <template x-for="l in ['it','en','fr','de','es']" :key="l">
                  <button type="button" @click="profileForm.preferred_language=l; profileLangOpen=false" class="flex w-full items-center gap-2 px-3 py-2 text-xs hover:bg-zinc-50 text-left">
                    <img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" />
                    <span x-text="t('lang.'+l)"></span>
                  </button>
                </template>
              </div>
            </div>
            <button @click="saveProfile()" class="w-full rounded-lg bg-black py-2 text-sm text-white">Save</button>
          </div>
        </section>

        <section x-show="view==='admin'" class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-xl font-bold" x-text="t('admin.title')"></h2>
            <button @click="loadAdminBookings(); loadAdminSettings()" class="rounded-lg border bg-white px-3 py-1 text-xs" x-text="t('btn.refresh')"></button>
          </div>
          <!-- Auto-approve toggle -->
          <div class="flex items-center justify-between rounded-xl border bg-white p-4" x-show="adminSettings">
            <div>
              <div class="font-medium text-sm">Auto-approve bookings</div>
              <div class="text-xs text-zinc-500" x-text="adminSettings ? (adminSettings.auto_approve_bookings ? 'New bookings auto-approved' : 'Requires manual approval') : ''"></div>
            </div>
            <button @click="toggleAutoApprove()" class="rounded-full px-4 py-2 text-xs font-medium" :class="adminSettings?.auto_approve_bookings ? 'bg-emerald-600 text-white' : 'bg-zinc-200'" x-text="adminSettings?.auto_approve_bookings ? 'ON' : 'OFF'"></button>
          </div>
          <div class="flex gap-2">
            <select x-model="adminFilter" @change="loadAdminBookings()" class="rounded-lg border px-3 py-2 text-sm">
              <option value="pending_approval" x-text="t('status.pending_approval')"></option>
              <option value="approved" x-text="t('status.approved')"></option>
              <option value="pending_registration" x-text="t('status.pending_registration')"></option>
              <option value="">All</option>
            </select>
            <span x-show="adminLoading" class="text-xs text-zinc-500 py-2">Loading…</span>
          </div>
          <p x-show="adminError" class="text-sm text-red-600" x-text="adminError"></p>
          <p x-show="!adminLoading && adminBookings.length===0" class="rounded-xl border bg-white p-6 text-center text-sm text-zinc-500">No bookings in this queue</p>
          <div class="space-y-3">
            <template x-for="b in adminBookings" :key="b.id">
              <div class="rounded-xl border bg-white p-4">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <div class="font-semibold" x-text="courtLabel(b)"></div>
                    <div class="text-sm text-zinc-600" x-text="`${b.date} · ${b.startTime}–${b.endTime}`"></div>
                    <div class="text-xs text-zinc-500" x-text="`${b.players===4 ? 'Double' : 'Single'} · ${b.rentRacquets ? b.rentRacquets + ' racquet(s)' : 'No racquets'} · user ${String(b.userId||'').slice(0,8)}`"></div>
                    <div x-show="b.notes" class="mt-1 text-xs italic text-zinc-600 bg-amber-50 p-2 rounded" x-text="b.notes"></div>
                    <div class="text-xs text-zinc-400" x-text="`ID ${b.id.slice(0,8)}`"></div>
                  </div>
                  <span class="rounded-full px-2 py-1 text-xs font-medium" :class="statusClass(b.status)" x-text="t('status.'+b.status)"></span>
                </div>
                <div class="mt-3 flex gap-2" x-show="b.status==='pending_approval'">
                  <button @click="approveBooking(b.id)" class="rounded-full bg-emerald-600 px-4 py-2 text-xs font-medium text-white hover:bg-emerald-700">Approve</button>
                  <button @click="rejectBooking(b.id)" class="rounded-full border px-4 py-2 text-xs hover:bg-zinc-50">Reject</button>
                </div>
              </div>
            </template>
          </div>
          <div class="grid gap-4 md:grid-cols-2 pt-4 border-t">
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('admin.courts')"></div><div class="text-sm text-zinc-600">CRUD at /api/courts</div></div>
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('admin.timetable')"></div><div class="text-sm text-zinc-600">PUT /api/timetable · 30/60/90/120</div></div>
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('admin.blocks')"></div><div class="text-sm text-zinc-600">Ad-hoc + recurring</div></div>
            <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('admin.settings')"></div><div class="text-sm" x-text="t('admin.settings.desc')"></div></div>
          </div>
        </section>
      </main>

      <footer class="border-t bg-white px-4 py-4 text-center text-xs text-zinc-500" x-text="t('footer')"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
